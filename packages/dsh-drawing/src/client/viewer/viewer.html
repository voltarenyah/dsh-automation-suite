<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drawing</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="pages" class="pages" role="document"></div>
    <div id="notice" class="notice">Loading drawing…</div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    </div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
