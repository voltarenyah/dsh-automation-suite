# Bundle patch of @voltarenyah/dsh-plcsim-advanced.
#
# The host row owns the C# controller and the plcsimRuntime seam. The
# model-facing tools live in the package's "./tools" row and are declared by an
# agent preset (leader), so a subagent preset never inherits them.
#
# Every config field has a default; a profile may insert the row without a
# config block. The defaults use the PLCSIM Advanced 4.0 API folder because it is
# the compatibility baseline (4.0-7.0 runtimes accept it; V7 verified).
- insert:
    - id: plcsim-advanced
      name: '@voltarenyah/dsh-plcsim-advanced'
