# dsh-automation-suite 发行版的政策层 —— 纯配置，不含任何插件代码。
#
# 本 profile 的用户 patch 层，在所有 bundle 层之后应用。
# 顶层是 loader patch 条目的 YAML 数组：按 id 覆盖 config、disable 某行，或 insert 新行。
#
# ── 为什么这里要重述一整个 preset（别把它"简化"掉）────────────────────────────
# 1. 系统提示词里唯一由**配置**提供的文本槽位是 persona prefix/suffix。但 web 组合的
#    agent 一律走 preset：preset 内的 dsh-persona 行在 agent 作用域注册同名段
#    `deployment:persona-prefix`，按作用域**遮蔽**全局 system-prompt 的 persona
#    （dsh-scope 的 ScopedLayers.merge；dsh-persona 包自己的注释也这么写）。
#    ⇒ 只改全局那一行，对 preset 会话是**无效**的。
# 2. loader 的 patch 是「按 key 浅合并、config 整体替换」（cordis-plugin-loader
#    src/config/entry.ts 的 Entry.update），嵌套的 config.plugins **不会**按 id 合并；
#    而且 web 组合里 base 的全局工具行全部 `disabled: true`，真正生效的工具面就在
#    preset 的 plugins 列表里。
#    ⇒ 覆盖或新建 preset 必须把 plugins 整份写出来，只写一个 persona 行会把工具全丢掉。
#
# ── 本文件做三件事 ────────────────────────────────────────────────────────────
# 1. 覆盖全局 system-prompt 的 persona：管**非 preset** agent（例如将来这个 profile 接
#    headless / ACP 入口时）。config 是整体替换，所以每个键都要重述一遍。
# 2. 插入发行版自己的 preset `suite`：内置 standard 的工具清单原样 + 发行版政策文本。
# 3. 把 agent-preset-registry 的默认 preset 指到 `suite`，新会话默认就用它。
#
# ⚠️ 升级 DSH 后：preset-suite 的 plugins 列表**不会**自动跟随上游 standard 的更新
#    （registry 文档：覆盖替换完整子插件列表，不自动合并）。重新生成办法：
#    打开 <app.asar>/dsh/node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml，
#    把 `- insert:` 块整段粘到下面，改三处 —— 行 id（preset-suite）、config.id（suite）、
#    order（0），再把 persona 行的 prefix/suffix 换成本文件里的政策文本。
#
#    本文件最近一次按上游重新生成：DSH 0.2.1-rc.2（2026-10-19）。相对 0.2.0-rc.2 的差异：
#    上游新增 time-context / tool-schedule / tool-plugin-market（最后一条在两端都是 disabled），
#    删除了 tool-subagent-codex / tool-subagent-claude-code / tool-ralph（本文件随之移除），
#    去掉了 dsh-tool-subagent 上已不存在的 `backgroundMode`，并更新了 plan-mode 的 section 文案。
#
# ⚠️ 用户若在 UI 里手动选过 preset，注册表条目的 volatile 字段 `selectedDefault` 会优先
#    于这里的部署默认值（见 dsh-agent-preset-registry README）。
#
# ── 想锁死政策（不许切回无政策的 preset）──────────────────────────────────────
# 给四个内置 preset 各加一条**只改 disabled** 的覆盖补丁即可 —— 不动 config，所以不会
# 碰到它们各自的工具面：
#
#   - id: preset-standard
#     disabled: true
#   - id: preset-ptc
#     disabled: true
#   - id: preset-minimal
#     disabled: true
#   - id: preset-cordis
#     disabled: true
#
# ── 想改政策文本：只改下面两处 block scalar ───────────────────────────────────

- id: system-prompt
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: true
    personaPrefix: |-
      You are the dsh-automation-suite agent: the deployment distribution of DeepSeek Harness
      that ships Siemens TIA Openness (V17) and git tooling. When a task matches one of those
      tools, use it instead of improvising shell commands.
    personaSuffix: |-
      Your working directory is {{cwd}}.

      Deployment rules for this distribution. They are stricter than your defaults and outrank
      any conflicting habit of your own:

      - Treat the "Current runtime context" block as authoritative for what you may do here, and
        never work around it.
      - Ask the user before any irreversible action: deleting or overwriting data, rewriting
        history, force-pushing, mass renames, or anything else you cannot undo.
      - Do not change machine-level state (installing software, editing system configuration,
        registering services) unless the user explicitly asks for that specific change.
      - Keep secrets out of your output: never print, copy, or transmit the contents of
        credential files, tokens, or private keys.
      - Use only the tools this deployment provides. When a capability is missing, say so instead
        of emulating it.

- id: agent-preset-registry
  config:
    default: suite

- insert:
    - id: preset-suite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: suite
        order: 0
        name: dsh-automation-suite
        description: 发行版默认 preset：内置工具面 + 发行版政策文本
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the dsh-automation-suite agent: the deployment distribution of DeepSeek Harness
                that ships Siemens TIA Openness (V17) and git tooling. When a task matches one of those
                tools, use it instead of improvising shell commands.
              suffix: |-
                Your working directory is {{cwd}}.

                Deployment rules for this distribution. They are stricter than your defaults and outrank
                any conflicting habit of your own:

                - Treat the "Current runtime context" block as authoritative for what you may do here, and
                  never work around it.
                - Ask the user before any irreversible action: deleting or overwriting data, rewriting
                  history, force-pushing, mass renames, or anything else you cannot undo.
                - Do not change machine-level state (installing software, editing system configuration,
                  registering services) unless the user explicitly asks for that specific change.
                - Keep secrets out of your output: never print, copy, or transmit the contents of
                  credential files, tokens, or private keys.
                - Use only the tools this deployment provides. When a capability is missing, say so instead
                  of emulating it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
